# The secrets scan half of ci-obligations.md §11, in its own workflow. SR-17
# says CI runs it on **every** PR, and "the tree must never contain a
# credential" is a claim about the whole tree — so the check that backs it
# cannot have a path filter. `ci.yml` has none either as of 2026-08-06, but
# that is a property of its triggers today; keeping the scan here makes the
# guarantee structural instead. Nothing here may gain a filter.
#
# The other half of §11, the dependency audit, stays in `ci.yml`: its input is
# the lockfile, and `ci.yml` already installs from it.
#
# gitleaks runs as a pinned docker image, not the action — repo settings allow
# only github-owned actions. No node, no pnpm, no install: this job is a
# checkout and a container, and it finishes in well under a minute.
name: sec

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The next step mounts this tree into a container. Don't leave the
          # token in .git/config.
          persist-credentials: false

      - name: Secrets scan (ci-obligations §11, SR-17)
        run: scripts/sec.sh secrets
