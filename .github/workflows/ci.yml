# ci.yml — skeleton of the pipeline specs/ci-obligations.md defines.
# Implemented so far: typecheck, api tests against Postgres with migrations,
# web build, docker image builds (not pushed), the four static design gates
# (contrast, token parity, banned vocabulary, no raw hex), the Playwright RTL
# stage, the dependency-audit half of the sec stage, and the perf and bundle
# stages. That is every obligation in the list except the dormant one.
#
# No `paths:` filter, deliberately: `checks` is a required status context on
# main, and a required context that never reports blocks a PR forever rather
# than skipping it. A doc-only PR pays a full run — build-status.md §3 has the
# guard-job alternative that was rejected. The secrets-scan half of §11 stays
# in sec.yml, which has never had a filter and must never gain one.
#
# Repo settings require SHA-pinned actions and allow only github-owned
# actions — pnpm comes via corepack, docker builds are plain `docker build`.
# The design gates are dependency-free scripts run by node's own type
# stripping, so they add no action to allowlist and nothing to install.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref; superseded pushes are cancelled (runner minutes are the
# same budget line as the instance).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Later steps run PR-authored code (install scripts, tests, the
          # Dockerfiles under deploy/). Don't leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: corepack enable && pnpm --version

      # Before install: the audit reads the lockfile, not node_modules, so
      # there is nothing to wait for. The other half of §11 — the secrets scan —
      # lives in sec.yml, which carries no paths filter because SR-17 is a
      # claim about the whole tree.
      - name: Dependency audit (ci-obligations §11, SR-21)
        run: scripts/sec.sh deps

      - name: Install
        run: pnpm install --frozen-lockfile

      # The design gates need neither the build nor the database, so they run
      # first: a palette that fails AA should not wait on Postgres to say so.
      - name: Token parity (ci-obligations §6)
        run: node scripts/token-parity.ts

      - name: No raw hex (ci-obligations §8)
        run: node scripts/no-raw-hex.ts

      - name: Contrast gate (ci-obligations §5)
        run: node scripts/contrast.ts

      - name: Typecheck api
        run: pnpm --filter api typecheck

      - name: Typecheck web
        run: pnpm --filter web exec astro check

      - name: Migrate (prisma migrate deploy against the service container)
        run: pnpm --filter api exec prisma migrate deploy

      - name: Test api
        run: pnpm --filter api test

      - name: Build web
        run: pnpm --filter web build

      # Greps what actually ships, so it has to follow the build.
      - name: Banned vocabulary (ci-obligations §7)
        run: node scripts/banned-vocab.ts

      - name: Build docker images (not pushed on PRs)
        run: |
          docker build -f deploy/api.Dockerfile -t api:ci .
          docker build -f deploy/web.Dockerfile -t web:ci .

      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4 caddy validate --config /etc/caddy/Caddyfile

      # ci-obligations §4. Last on purpose: this step installs the e2e fixtures
      # into the content collections, so everything that ships or greps what
      # ships — the build, the banned-vocabulary gate, both images — has
      # already run against a tree with no fixture in it. The script takes them
      # back out when it exits.
      #
      # It serves the built site through the real deploy/Caddyfile in the
      # pinned Caddy image and runs the suite from the pinned Playwright image,
      # which is also how it runs on a laptop — that is what makes the
      # checked-in screenshot baseline meaningful. Both are docker images, not
      # actions, so nothing here needs allowlisting.
      - name: RTL stage (ci-obligations §4)
        run: web/tests/run-e2e.sh

      # Same fixture mechanism and the same reason for the position as the RTL
      # stage above: it installs fixtures into the collections and rebuilds
      # web/dist with them, so it must run after `Build web`, after `Banned
      # vocabulary` and after both image builds — and nothing that greps or
      # ships web/dist may follow it. It goes one step further and removes the
      # build on the way out.
      #
      # A step in this job rather than a job of its own: a new job is a new
      # status context, and a context that is not named in the branch
      # protection is advisory no matter what it asserts.
      - name: Perf and bundle stages (ci-obligations §10)
        run: web/tests/run-perf.sh

      # The diff images are the whole diagnosis when a screenshot assertion
      # fails, and they do not exist anywhere else.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
